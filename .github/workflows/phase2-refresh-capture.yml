name: Phase II Day16 Refresh Capture

on:
  push:
    branches:
      - capture/phase2-day16-refresh-2026-09-20

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build current main implementation
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/condition-trace-vite.log 2>&1 &
          echo $! > /tmp/condition-trace-vite.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/condition-trace-vite.log
          exit 1

      - name: Capture latest current implementation
        env:
          CAPTURE_URL: http://127.0.0.1:4173
        run: node submission-video/capture/phase2-refresh-capture.cjs

      - name: Upload refresh evidence
        uses: actions/upload-artifact@v4
        with:
          name: day16-phase2-current-refresh
          path: phase2-refresh-output/
          if-no-files-found: error
          retention-days: 14
